name: CI

# Phase 10E/10F — authoritative quality gates on the authoritative platform.
# Windows is required because LocalStack's discovery, process intelligence,
# control registry, tray, and window lifecycle code are Windows-native.
#
# Live/ignored tests that require Docker, Ollama, disposable child processes,
# tray interaction, or real autostart state are intentionally excluded from
# normal CI and remain part of manual release verification.

on:
  push:
    branches: [main]
  pull_request:

# CI only needs read access.
# Publishing releases is deliberately handled separately.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality-gates:
    name: Quality gates (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            src-tauri\target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Reproducible frontend dependency install.
      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Deterministic frontend suite only.
      - name: Frontend tests
        run: npm run test:run

      - name: Frontend build
        run: npm run build

      # Locked Rust dependency verification.
      - name: Rust check (locked)
        working-directory: src-tauri
        run: cargo check --locked

      # This also executes the static safety guards:
      # - no raw PID Tauri control
      # - no generic shell/HTTP/Docker proxy
      # - no group-0 console broadcast
      # - workspace poison state remains fail-closed
      # - tray/window lifecycle cannot control services
      - name: Rust tests (locked, deterministic)
        working-directory: src-tauri
        run: cargo test --locked

      # Release-blocking custom-protocol verification.
      #
      # Tauri's devUrl legitimately remains in tauri.conf.json for development,
      # and that text may appear in compiled metadata. Therefore CI must not
      # reject a binary merely because the localhost dev URL exists as a byte
      # string.
      #
      # Instead, verify that:
      # 1. the Cargo feature correctly maps to Tauri custom-protocol,
      # 2. the project builds successfully with that feature enabled,
      # 3. the expected executable is produced.
      - name: Custom-protocol guard
        working-directory: src-tauri
        run: |
          grep -Fq 'custom-protocol = ["tauri/custom-protocol"]' Cargo.toml
          cargo build --locked --features custom-protocol
          test -f target/debug/localstack-control-center.exe

  # Release packaging remains a separate manually triggered workflow.
  # See .github/workflows/release.yml.