name: CI

# Phase 10E — authoritative quality gates on the authoritative platform.
# Windows is required: LocalStack's discovery, process intelligence, control
# registry, and tray/window code are Windows-native (windows-sys FFI).
# Live/ignored tests (real Docker, real Ollama, disposable child processes,
# tray/autostart) are deliberately NOT run here — see the bottom of this file
# and docs/install-windows.md for the manual procedure.

on:
  push:
    branches: [main]
  pull_request:

# Minimum permissions: read-only checkout is all CI needs. No secrets, no
# release publishing from CI (Phase 10E policy — release.yml is manual).
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality-gates:
    name: Quality gates (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable, locked)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            src-tauri\target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Reproducible install (§L): npm ci, never npm install.
      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Deterministic suite only (§F): fixture/stub tests. Environment-
      # dependent tests are #[ignore]/describe.skip in the source and stay out.
      - name: Frontend tests
        run: npm run test:run

      - name: Frontend build
        run: npm run build

      # Locked dependency builds (§M): correctness against Cargo.lock.
      - name: Rust check (locked)
        working-directory: src-tauri
        run: cargo check --locked

      # Includes every static safety guard test: raw-PID control, generic
      # shell/HTTP/Docker proxies, group-0 console broadcasts, workspace
      # poison bypass, service lifecycle from tray/window code — a PR that
      # reintroduces any of these fails here (§G). Same job, same bar.
      - name: Rust tests (locked, deterministic)
        working-directory: src-tauri
        run: cargo test --locked

      # Release-blocking custom-protocol gate (§D): the release binary must
      # embed the bundled assets and never require the dev server. The plain
      # `cargo build` without the feature MUST reference localhost:1420 (the
      # dev fallback), and the custom-protocol build MUST NOT.
      - name: Custom-protocol guard
        working-directory: src-tauri
        run: |
          cargo check --locked
          strings_target="$(cygpath -u "$GITHUB_WORKSPACE")/src-tauri"
          if grep -rq "localhost:1420" target/debug/*.exe 2>/dev/null; then
            echo "debug binary references dev URL (expected without custom-protocol)"
          fi
          cargo rustc --locked --features custom-protocol --crate-type bin -p localstack-control-center --bin localstack-control-center 2>/dev/null || \
            cargo build --locked --features custom-protocol
          ! grep -q "localhost:1420" target/debug/localstack-control-center.exe

  # §J: release packaging is a separate, manually triggered workflow.
  # See .github/workflows/release.yml (workflow_dispatch only, artifacts-only).
