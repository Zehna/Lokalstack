name: Release build

# Phase 10E (§J) — manually triggered release-candidate packaging.
# Builds the Tauri NSIS/MSI installers on Windows and exposes them as CI
# artifacts ONLY. No GitHub Release is created, no tag is required, nothing
# is published publicly (§AR). Phase 10F decides the public release path.

on:
  workflow_dispatch:

# Minimum permissions (§K): checkout only. No release write, no secrets.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package Windows installers (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            src-tauri\target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      # Same gates as CI — a release build never skips quality.
      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:run

      - name: Rust tests (locked)
        working-directory: src-tauri
        run: cargo test --locked

      # The authoritative production build path (§C): Tauri's own flow,
      # which runs `npm run build` (beforeBuildCommand) and compiles the
      # Rust crate WITH the custom-protocol feature so the bundled assets
      # are embedded (never the dev URL).
      # Cache hygiene: the Cargo cache restores src-tauri/target wholesale,
      # including a bundle/ directory from a previous release (e.g. 1.0.0
      # installers). Tauri does not clear it, and the collect step globs
      # *.exe/*.msi, so stale bundles would ship alongside the fresh ones
      # (observed on the first 1.0.1 run). Remove stale bundle output before
      # building; the Rust compile cache stays intact.
      - name: Clear stale bundle outputs
        run: rm -rf src-tauri/target/release/bundle

      - name: Tauri build (NSIS + MSI)
        run: npm run tauri build

      - name: Collect artifacts
        env:
          EXPECTED_VERSION: 1.1.0
        run: |
          mkdir -p release-artifacts
          find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} release-artifacts/ \;
          cp src-tauri/target/release/localstack-control-center.exe release-artifacts/localstack-control-center-standalone.exe
          # Prefix-free manifest: three binaries, relative names (sha256sum -c
          # runs from inside release-artifacts). Tmp+mv so the manifest can
          # never include itself; a missing pattern fails sha256sum (non-zero).
          ( cd release-artifacts && sha256sum -- *.exe *.msi ) > release-artifacts/SHA256SUMS.txt.tmp && mv release-artifacts/SHA256SUMS.txt.tmp release-artifacts/SHA256SUMS.txt
          # Guard (§C): exactly the expected 1.1.0 installers, no duplicates,
          # no stale other-version files, standalone + checksums present.
          expected=(
            "LocalStack Control Center_1.1.0_x64-setup.exe"
            "LocalStack Control Center_1.1.0_x64_en-US.msi"
            "localstack-control-center-standalone.exe"
            "SHA256SUMS.txt"
          )
          fail=0
          for f in "${expected[@]}"; do
            if [ ! -f "release-artifacts/$f" ]; then
              echo "MISSING expected artifact: $f"; fail=1
            fi
          done
          # File count must match exactly (catches stale/duplicate/other-version files).
          actual=$(find release-artifacts -maxdepth 1 -type f | wc -l)
          if [ "$actual" -ne "${#expected[@]}" ]; then
            echo "UNEXPECTED artifact set: found $actual files, expected ${#expected[@]}"; fail=1
          fi
          # Every installer filename must carry the expected version.
          if ls release-artifacts | grep -Ev '^(LocalStack Control Center_1\.1\.0_x64-setup\.exe|LocalStack Control Center_1\.1\.0_x64_en-US\.msi|localstack-control-center-standalone\.exe|SHA256SUMS\.txt)$' | grep -q .; then
            echo "UNEXPECTED or STALE artifact filenames detected"; fail=1
          fi
          ls -la release-artifacts
          exit $fail

      # Artifacts only (§J): downloadable from the workflow run for 14 days.
      # This does NOT create a GitHub Release and nothing becomes public.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localstack-control-center-1.1.0-rc
          path: release-artifacts/
          retention-days: 14
          if-no-files-found: error
