[package]
name = "localstack-control-center"
version = "0.1.0"
description = "Local development environment control center — see everything running on localhost."
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `lib` name must match the Windows DLL name expected by Tauri.
name = "localstack_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Control-target registry (Phase 5 hardened): audited BLAKE3 for opaque,
# unpredictable target ids.
blake3 = "1"
# AI runtime inspection (Phase 8): local HTTP probing of already-discovered
# AI services. Small dependency surface: blocking client, rustls, no
# automatic redirects (a redirect to a non-loopback host must be rejected,
# never followed — spec §6).
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
# URL parsing for the AI endpoint trust policy (same version reqwest uses).
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  # Process intelligence (Phase 2): OpenProcess/GetProcessTimes/
  # QueryFullProcessImageNameW, memory counters, and the process snapshot API.
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Diagnostics_ToolHelp",
  # Docker Engine named-pipe transport (Phase 9): CreateFileW on
  # \\.\pipe\docker_engine lives in Storage::FileSystem.
  "Win32_Storage_FileSystem",
  # Command-line retrieval (Phase 3): NtQueryInformationProcess (Wdk) and
  # ReadProcessMemory for reading the target's RTL_USER_PROCESS_PARAMETERS.
  # Win32_System_Kernel gates the PEB/PROCESS_BASIC_INFORMATION structs.
  "Wdk_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  # Safe service control (Phase 5, hardened): WaitForSingleObject and
  # ShellExecuteW (gated on WindowsAndMessaging for SHOW_WINDOW_CMD).
  # Deliberately NO Win32_System_Console: GenerateConsoleCtrlEvent(…, 0)
  # is a console-wide broadcast and must not be used against externally
  # discovered processes (see docs/architecture.md).
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
